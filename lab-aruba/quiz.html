<script>window.QUIZ_BANK = {"exam":"HPE6-A86","title":"HPE Aruba Networking Certified Associate \u2013 Switching","minutes":90,"count":60,"pass":73,"note":"\u0e02\u0e49\u0e2d\u0e2a\u0e2d\u0e1a\u0e43\u0e19\u0e04\u0e25\u0e31\u0e07\u0e19\u0e35\u0e49\u0e40\u0e02\u0e35\u0e22\u0e19\u0e02\u0e36\u0e49\u0e19\u0e43\u0e2b\u0e21\u0e48\u0e15\u0e32\u0e21\u0e2b\u0e31\u0e27\u0e02\u0e49\u0e2d\u0e43\u0e19 data sheet \u0e02\u0e2d\u0e07 HPE (Revision 4) \u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e1d\u0e36\u0e01 \u0e44\u0e21\u0e48\u0e43\u0e0a\u0e48\u0e02\u0e49\u0e2d\u0e2a\u0e2d\u0e1a\u0e08\u0e23\u0e34\u0e07","domains":{"1":{"name":"Foundational networking","pct":24,"mock":14},"2":{"name":"HPE Aruba Networking products \u0026 solutions","pct":21,"mock":13},"3":{"name":"Install, configure, set up \u0026 validate","pct":22,"mock":13},"4":{"name":"Troubleshoot, operate \u0026 maintain","pct":17,"mock":10},"5":{"name":"Manage \u0026 monitor","pct":16,"mock":10}},"objectives":{"1.1":"OSI model","1.2":"Layer 1 media","1.3":"Layer 2 Ethernet \/ broadcast domains","1.4":"Layer 3 addressing, subnetting, ARP, routing","1.5":"Layer 4 protocols","1.6":"Management protocols (TFTP, SFTP, FTP, Telnet, SNMPv2)","1.7":"QoS","1.8":"Basic switch security","1.9":"STP\/RSTP and VSF","1.10":"Link aggregation","1.11":"VLANs","2.1":"Wired product features \u0026 management options","2.2":"Software capabilities","2.3":"Hardware capabilities","2.4":"Management tool sets","3.1":"Initial settings \u0026 management access","3.2":"Layer 2 config (RSTP\/MSTP, LAG, VLAN, LLDP)","3.3":"Layer 3 config (IP, routing)","3.4":"Validate with show commands","4.1":"Troubleshoot switched \u0026 routed networks","4.2":"General troubleshooting tools","5.1":"Network management \u0026 administration best practices"},"questions":[{"id":1,"o":"1.1","q":"At which OSI layer does a switch forward frames based on MAC addresses?","c":["Layer 1 \u2013 Physical","Layer 2 \u2013 Data Link","Layer 3 \u2013 Network","Layer 4 \u2013 Transport"],"a":[1],"e":"Switch \u0e17\u0e31\u0e48\u0e27\u0e44\u0e1b\u0e17\u0e33\u0e07\u0e32\u0e19\u0e17\u0e35\u0e48 Layer 2 \u0e43\u0e0a\u0e49 MAC address \u0e43\u0e19\u0e01\u0e32\u0e23\u0e2a\u0e48\u0e07 frame (Layer 3 \u0e43\u0e0a\u0e49 IP address)"},{"id":2,"o":"1.1","q":"Which OSI layer is responsible for logical addressing and path selection between networks?","c":["Data Link","Network","Transport","Session"],"a":[1],"e":"Layer 3 (Network) \u0e14\u0e39\u0e41\u0e25 IP address \u0e41\u0e25\u0e30\u0e01\u0e32\u0e23\u0e40\u0e25\u0e37\u0e2d\u0e01\u0e40\u0e2a\u0e49\u0e19\u0e17\u0e32\u0e07 (routing)"},{"id":3,"o":"1.1","q":"What is the protocol data unit (PDU) called at the Transport layer when TCP is used?","c":["Frame","Packet","Segment","Bit"],"a":[2],"e":"Layer 4 = segment (TCP) \u00b7 Layer 3 = packet \u00b7 Layer 2 = frame \u00b7 Layer 1 = bit"},{"id":4,"o":"1.2","q":"What is the maximum supported channel length for 1000BASE-T over Category 5e or 6 twisted-pair cable?","c":["55 m","100 m","300 m","550 m"],"a":[1],"e":"Ethernet \u0e1a\u0e19\u0e2a\u0e32\u0e22\u0e17\u0e2d\u0e07\u0e41\u0e14\u0e07 (1000BASE-T) \u0e44\u0e14\u0e49\u0e2a\u0e39\u0e07\u0e2a\u0e38\u0e14 100 \u0e40\u0e21\u0e15\u0e23"},{"id":5,"o":"1.2","q":"You need a 10 Gbps link of about 250 m between two buildings\u0027 wiring closets over existing OM3 multimode fiber. Which transceiver type is appropriate?","c":["10GBASE-T","10GBASE-SR","10GBASE-LR","Direct attach copper (DAC)"],"a":[1],"e":"SR = multimode \u0e23\u0e30\u0e22\u0e30\u0e2a\u0e31\u0e49\u0e19 (OM3 ~300 m) \u00b7 LR = single-mode ~10 km \u00b7 DAC \u0e44\u0e14\u0e49\u0e44\u0e21\u0e48\u0e01\u0e35\u0e48\u0e40\u0e21\u0e15\u0e23 \u00b7 10GBASE-T \u0e40\u0e1b\u0e47\u0e19\u0e17\u0e2d\u0e07\u0e41\u0e14\u0e07 \u2264100 m"},{"id":6,"o":"1.3","q":"A switch receives a unicast frame whose destination MAC address is not in its MAC address table. What does the switch do?","c":["Drops the frame","Floods the frame out all ports in the same VLAN except the receiving port","Sends the frame to the default gateway","Sends an ARP request for the MAC address"],"a":[1],"e":"unknown unicast \u0e08\u0e30\u0e16\u0e39\u0e01 flood \u0e43\u0e19 VLAN \u0e40\u0e14\u0e35\u0e22\u0e27\u0e01\u0e31\u0e19 (\u0e22\u0e01\u0e40\u0e27\u0e49\u0e19 port \u0e17\u0e35\u0e48\u0e23\u0e31\u0e1a\u0e40\u0e02\u0e49\u0e32\u0e21\u0e32) \u0e41\u0e25\u0e49\u0e27\u0e08\u0e33 MAC \u0e40\u0e21\u0e37\u0e48\u0e2d\u0e21\u0e35\u0e01\u0e32\u0e23\u0e15\u0e2d\u0e1a\u0e01\u0e25\u0e31\u0e1a"},{"id":7,"o":"1.3","q":"Which statement about broadcast domains is correct?","c":["Each switch port is its own broadcast domain","Each VLAN is a separate broadcast domain","A Layer 2 switch separates broadcast domains by default","Broadcasts are forwarded by routers to all subnets"],"a":[1],"e":"1 VLAN = 1 broadcast domain \u00b7 \u0e15\u0e49\u0e2d\u0e07\u0e21\u0e35 Layer 3 (router\/SVI) \u0e04\u0e31\u0e48\u0e19\u0e23\u0e30\u0e2b\u0e27\u0e48\u0e32\u0e07\u0e01\u0e31\u0e19 \u00b7 router \u0e44\u0e21\u0e48\u0e2a\u0e48\u0e07 broadcast \u0e02\u0e49\u0e32\u0e21\u0e27\u0e07"},{"id":8,"o":"1.3","q":"What is the destination MAC address of an Ethernet broadcast frame?","c":["00:00:00:00:00:00","01:00:5E:00:00:01","FF:FF:FF:FF:FF:FF","The MAC address of the default gateway"],"a":[2],"e":"broadcast = FF:FF:FF:FF:FF:FF \u00b7 01:00:5E\u2026 \u0e40\u0e1b\u0e47\u0e19 multicast"},{"id":9,"o":"1.4","q":"How many usable host addresses are available in a \/26 subnet?","c":["30","62","64","126"],"a":[1],"e":"\/26 = 2^6 = 64 address \u0e25\u0e1a network \u0e41\u0e25\u0e30 broadcast = 62 host"},{"id":10,"o":"1.4","q":"Which subnet mask is equivalent to a \/20 prefix?","c":["255.255.224.0","255.255.240.0","255.255.248.0","255.255.255.240"],"a":[1],"e":"\/20 = 8+8+4 bit \u2192 octet \u0e17\u0e35\u0e48 3 = 11110000 = 240 \u2192 255.255.240.0"},{"id":11,"o":"1.4","q":"A host is configured as 192.168.10.77\/27. What is its network address?","c":["192.168.10.0","192.168.10.64","192.168.10.72","192.168.10.96"],"a":[1],"e":"\/27 \u0e
