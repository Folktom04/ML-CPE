# ตัวอย่าง inventory ของ netcollect
# - ห้ามใส่รหัสผ่าน/token ในไฟล์นี้: ระบุ "ชื่อ environment variable" ที่เก็บค่าแทน (username_env, password_env, token_env)
# - ลำดับการรวมค่า: defaults -> groups -> ค่าในอุปกรณ์แต่ละตัว (ค่าหลังทับค่าก่อน)
# - ทดลองได้ทันทีโดยไม่ต้องมีอุปกรณ์:  python -m netcollect collect -i inventory.example.yaml --mock

defaults:
  timeout: 20
  verify_tls: true            # ใช้ path ของไฟล์ CA ได้ เช่น /etc/ssl/certs/corp-ca.pem ; false เฉพาะ lab

groups:
  cisco:
    username_env: NET_USER
    password_env: NET_PASS
  fortigate:
    platform: fortigate

devices:
  # ---------- Cisco (SSH + TextFSM) ----------
  - name: core-sw-01
    platform: cisco_ios
    group: cisco
    host: 10.0.10.2
    tags: {site: BKK, role: core}

  - name: core-sw-02
    platform: cisco_ios
    group: cisco
    host: 10.0.10.3
    tags: {site: BKK, role: core}

  - name: edge-rtr-01
    platform: cisco_ios
    group: cisco
    host: 10.0.10.1
    tags: {site: BKK, role: edge}
    options:
      commands:                 # เปลี่ยนคำสั่งเฉพาะเครื่องได้
        interfaces_brief: "show ip interface brief | exclude unassigned"

  # ---------- FortiGate (REST API, token ของ REST API Admin แบบ read-only) ----------
  - name: fgt-hq
    group: fortigate
    host: 10.0.10.254
    token_env: FGT_HQ_TOKEN
    tags: {site: BKK, role: firewall}

  - name: fgt-branch-cnx
    group: fortigate
    host: 10.1.10.1
    port: 8443                  # ถ้า admin HTTPS ไม่ได้อยู่ที่ 443
    token_env: FGT_CNX_TOKEN
    tags: {site: CNX, role: firewall}

  - name: fgt-branch-hdy
    group: fortigate
    host: 10.4.10.1
    token_env: FGT_HDY_TOKEN
    vdom: root                  # ใส่เมื่อเปิดใช้ VDOM
    tags: {site: HDY, role: firewall}

  # ---------- Palo Alto (XML API, API key ของ admin แบบ read-only) ----------
  - name: pa-dmz-01
    platform: paloalto
    host: 10.0.10.21
    token_env: PA_DMZ_KEY
    tags: {site: BKK, role: firewall}

  # ---------- REST API อะไรก็ได้ (ตัวอย่าง: NetBox) ----------
  - name: netbox
    platform: rest
    host: netbox.corp.example
    token_env: NETBOX_TOKEN
    options:
      auth_header: Authorization
      auth_prefix: "Token "
      endpoints:
        - name: devices
          path: /api/dcim/devices/?limit=1000
          items: results
          fields: [name, status.value, site.name, primary_ip4.address]
        - name: prefixes
          path: /api/ipam/prefixes/?status=active&limit=1000
          items: results
          fields: [prefix, vlan.vid, vlan.name, site.name]

  # ---------- ทดสอบการเข้าถึงบริการจากเครื่องที่รันสคริปต์ ----------
  - name: erp-check
    platform: probe
    host: erp.corp.example
    options:
      dns: true
      ping: true
      tcp_ports: [443, 1433]
