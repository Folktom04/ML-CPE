const KEY = 'cefr-ladder-v1';
const fresh = () => ({ xp: 0, streak: 0, lastDay: '', mastered: {}, mistakes: {}, passed: {}, best: {}, placement: '', rate: 0.9 });
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function touchStreak() {
  const t = today();
  if (S.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yk = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate();
  S.streak = S.lastDay === yk ? S.streak + 1 : 1;
  S.lastDay = t;
}

/* ------------------------------------------------------------------ */
/* Helpers                                                             */
/* ------------------------------------------------------------------ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const lvIndex = l => LEVELS.indexOf(l);
const expand = s => norm(s).replace(/\bcan't\b/g, 'cannot').replace(/\bwon't\b/g, 'will not').replace(/\bshan't\b/g, 'shall not')
  .replace(/n't\b/g, ' not').replace(/'re\b/g, ' are').replace(/\bi'm\b/g, 'i am').replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will')
  .replace(/\bcannot\b/g, 'can not').replace(/\s+/g, ' ').trim();
const norm = s => s.toLowerCase().replace(/[‘’]/g, "'").replace(/[.,!?;:"“”]/g, '').replace(/\s+/g, ' ').trim();
function setLv(l) { document.documentElement.style.setProperty('--lv', 'var(--' + l + ')'); }

let voice = null;
const hasTTS = 'speechSynthesis' in window;
function loadVoice() {
  if (!hasTTS) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (hasTTS) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function speak(text, slow) {
  if (!hasTTS) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : 'en-GB';
    if (voice) u.voice = voice;
    u.rate = slow ? 0.6 : S.rate;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ------------------------------------------------------------------ */
/* Question builders. Every question has a stable id so mistakes can   */
/* be rebuilt later in Review.  id = level|mode|index[|sub]            */
/* ------------------------------------------------------------------ */
function build(id) {
  const [lv, mode, a, b] = id.split('|');
  if (mode === 'story' || mode === 'sword') return buildStory(id);
  const D = DATA[lv], li = lvIndex(lv), i = +a;
  if (mode === 'vocab') {
    const [w, th, def] = D.vocab[i];
    const others = D.vocab.filter((_, k) => k !== i);
    const dir = li <= 2 ? (Math.random() < .6 ? 'en-th' : 'th-en') : (Math.random() < .6 ? 'word-def' : 'def-word');
    const q = { id, lv, mode, type: 'mc', speakText: w };
    if (dir === 'en-th') Object.assign(q, { prompt: w, big: true, sub: 'คำนี้แปลว่าอะไร', answer: th, choices: shuffle([th, ...pick(others, 3).map(x => x[1])]) });
    if (dir === 'th-en') Object.assign(q, { prompt: th, big: true, sub: 'ภาษาอังกฤษคือคำไหน', answer: w, choices: shuffle([w, ...pick(others, 3).map(x => x[0])]), speakAfter: true });
    if (dir === 'word-def') Object.assign(q, { prompt: w, big: true, sub: 'Choose the best definition.', answer: def, choices: shuffle([def, ...pick(others, 3).map(x => x[2])]) });
    if (dir === 'def-word') Object.assign(q, { prompt: '“' + def + '”', sub: 'Which word matches this definition?', answer: w, choices: shuffle([w, ...pick(others, 3).map(x => x[0])]), speakAfter: true });
    q.explain = '<b>' + esc(w) + '</b> = ' + esc(th) + ' — <i>' + esc(def) + '</i>';
    return q;
  }
  if (mode === 'grammar') {
    const [s, ans, wrong, note] = D.grammar[i];
    return { id, lv, mode, type: 'mc', prompt: s, gap: true, sub: 'เลือกคำที่เติมแล้วถูกต้อง', answer: ans, choices: shuffle([ans, ...wrong]),
      explain: esc(note), full: s.replace('___', ans) };
  }
  if (mode === 'order') {
    const [en, th] = D.order[i];
    const words = en.split(' ');
    let tiles = shuffle(words);
    for (let t = 0; t < 5 && tiles.join(' ') === en; t++) tiles = shuffle(words);
    return { id, lv, mode, type: 'order', prompt: th, sub: 'เรียงคำให้ได้ความหมายนี้', answer: en, tiles };
  }
  if (mode === 'listen') {
    // a = 'w' + vocab index or 's' + sentence index
    const isWord = a[0] === 'w', k = +a.slice(1);
    const text = isWord ? D.vocab[k][0] : D.order[k][0];
    const th = isWord ? D.vocab[k][1] : D.order[k][1];
    return { id, lv, mode, type: 'type', answer: text, th, isWord };
  }
  if (mode === 'reading') {
    const P = D.reading[i], [qq, ans, wrong] = P.qs[+b];
    return { id, lv, mode, type: 'mc', passage: P.p, prompt: qq, answer: ans, choices: shuffle([ans, ...wrong]), speakPassage: P.p };
  }
  if (mode === 'interpret') {
    const [text, qq, ans, wrong, note] = D.interpret[i];
    return { id, lv, mode, type: 'mc', passage: text, quote: true, prompt: qq, answer: ans, choices: shuffle([ans, ...wrong]), explain: esc(note), speakPassage: text.replace(/^[A-Z][a-z]*:\s*/gm, '') };
  }
  if (mode === 'situation') {
    const [sit, ans, wrong, note] = D.situation[i];
    return { id, lv, mode, type: 'mc', prompt: sit, sub: 'เลือกคำพูดที่เหมาะสมที่สุดกับสถานการณ์นี้', answer: ans, choices: shuffle([ans, ...wrong]), explain: esc(note), speakAnswer: true };
  }
  if (mode === 'errors') {
    const [raw, wi, fix, note] = D.errors[i];
    const segs = raw.split(' | ');
    return { id, lv, mode, type: 'spot', prompt: segs.join(' '), segs, wi, answer: segs[wi] + ' \u2192 ' + fix, fix, explain: esc(note) };
  }
  if (mode === 'build') {
    const [task, orig, key, start, end, answers] = D.build[i];
    return { id, lv, mode, type: 'gap', prompt: task, orig, key, start, end, answers, answer: (start ? start + ' ' : '') + answers[0] + (/^[.,?!]/.test(end) ? '' : ' ') + end };
  }
}

function ids(lv, mode) {
  const D = DATA[lv];
  if (mode === 'vocab') return D.vocab.map((_, i) => `${lv}|vocab|${i}`);
  if (mode === 'grammar') return D.grammar.map((_, i) => `${lv}|grammar|${i}`);
  if (mode === 'order') return D.order.map((_, i) => `${lv}|order|${i}`);
  if (mode === 'listen') return [...D.order.map((_, i) => `${lv}|listen|s${i}`), ...D.vocab.map((_, i) => `${lv}|listen|w${i}`)];
  if (mode === 'reading') return D.reading.flatMap((P, i) => P.qs.map((_, j) => `${lv}|reading|${i}|${j}`));
  if (['interpret', 'situation', 'errors', 'build'].includes(mode)) return D[mode].map((_, i) => `${lv}|${mode}|${i}`);
  return [];
}
const PRACTICE = ['vocab', 'grammar', 'errors', 'reading', 'interpret', 'listen', 'order', 'build', 'situation'];
function share(list) { return list.length ? list.filter(id => S.mastered[id]).length / list.length : 0; }
function totalItems(lv) { return PRACTICE.reduce((n, m) => n + ids(lv, m).length, 0); }
function mastery(lv) { return share(PRACTICE.flatMap(m => ids(lv, m))); }
function skillMastery(lv, sk) { return share(sk.modes.flatMap(m => ids(lv, m))); }

function roundIds(lv, mode) {
  if (mode === 'reading') return ids(lv, 'reading');
  if (mode === 'listen') {
    const s = pick(ids(lv, 'listen').filter(x => x.includes('|s')), 4);
    const w = pick(ids(lv, 'listen').filter(x => x.includes('|w')), 4);
    return shuffle([...s, ...w]);
  }
  if (mode === 'exam') {
    // 15 questions covering every skill
    const pi = Math.floor(Math.random() * DATA[lv].reading.length);
    return [
      ...pick(ids(lv, 'vocab'), 2), ...pick(ids(lv, 'grammar'), 2), ...pick(ids(lv, 'errors'), 1),
      `${lv}|reading|${pi}|0`, `${lv}|reading|${pi}|1`, ...pick(ids(lv, 'interpret'), 2),
      ...pick(ids(lv, 'listen').filter(x => x.includes('|s')), 1),
      ...pick(ids(lv, 'order'), 1), ...pick(ids(lv, 'build'), 2), ...pick(ids(lv, 'situation'), 2)
    ];
  }
  if (mode === 'mix') {
    const one = PRACTICE.map(m => pick(ids(lv, m), 1)[0]);
    const extra = pick(ids(lv, pick(['situation', 'interpret', 'build'], 1)[0]).filter(x => !one.includes(x)), 1);
    return shuffle([...one, ...extra]);
  }
  return pick(ids(lv, mode), 10);
}

function parseGlos(str) {
  const m = new Map();
  str.split(';').map(x => x.trim()).filter(Boolean).forEach(e => {
    const [w, pos, th] = e.split('|').map(x => x.trim());
    if (w && !m.has(key(w))) m.set(key(w), { w, pos, th });

  return m;
}

function lookup(raw, G1) {
  const w = key(raw).replace(/^[-']+|[-']+$/g, '');

  if (/s$/.test(base)) stems.push(base.slice(0, -1));
  if (/ied$/.test(base)) stems.push(base.slice(0, -3) + 'y');
  if (/ed$/.test(base)) stems.push(base.slice(0, -2), base.slice(0, -1), base.slice(0, -3));
  if (/ing$/.test(base)) stems.push(base.slice(0, -3), base.slice(0, -3) + 'e', base.slice(0, -4));
  if (/er$/.test(base)) stems.push(base.slice(0, -2), base.slice(0, -1));
  if (/est$/.test(base)) stems.push(base.slice(0, -3), base.slice(0, -2));
  if (/ly$/.test(base)) stems.push(base.slice(0, -2));
  stems.forEach(s => tries.push([s, 'รูปที่เปลี่ยนจาก']));
  for (const [t, why] of tries) for (const dict of [G1, BASIC]) {
    const e = dict.get(t);
    if (e) return Object.assign({}, e, { how: why === 'รูปที่เปลี่ยนจาก' ? `${raw} เป็นรูปที่เปลี่ยนจาก ${e.w}` : why ? raw + ': ' + why : '' });
  }

}

    const e = esc(p), at = html.indexOf(e);

}

function placementId() {
  const lv = LEVELS[G.cur];
  const pool = [...ids(lv, 'vocab'), ...ids(lv, 'grammar'), ...ids(lv, 'interpret'), ...ids(lv, 'situation')].filter(x => !G.used[x]);
  const id = pool[Math.floor(Math.random() * pool.length)];
  G.used[id] = 1;

}

function next() {
  if (G.kind === 'placement') {
    if (G.i >= G.total) return placementResult();
    G.queue[G.i] = placementId();
  } else if (G.i >= G.queue.length || G.hearts === 0) return result();
  const q = build(G.queue[G.i]);
  G.q = q; G.answered = false;
  setLv(q.lv);
  render(q);
}

        <p class="sub">${tts ? 'ไม่ต้องสนใจตัวพิมพ์ใหญ่และเครื่องหมายวรรคตอน' : 'ตัวอักษรแรกคือ “' + esc(q.answer[0]) + '” · ' + q.answer.length + ' ตัวอักษร'}</p>
      </div>
      ${tts ? `<div class="speakrow"><button class="speak" id="say">🔊 เล่นเสียง</button><button class="speak" id="saySlow">🐢 ช้าลง</button></div>` : ''}
      <input class="textin" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์ที่นี่" aria-label="คำตอบ">
      <button class="btn lv block" id="check">ตรวจคำตอบ</button>`;
  }
  app.innerHTML = `${header()}
    <article class="card">
      <div class="kind"><span class="pill">${q.lv} · ${MODES[q.mode].tag}</span><span class="muted" style="font-size:.85rem">${label}</span></div>
      ${body}
      <div id="fb"></div>
    </article>`;
  $('#quit').onclick = () => G.story != null ? openStory(G.lv, G.story, 'quiz') : (G.kind === 'practice' || G.kind === 'exam') ? level(G.lv) : home();

  if (q.type === 'mc') {
    app.querySelectorAll('.choice').forEach(b => b.onclick = () => answerMC(+b.dataset.k));
    if ($('#say')) $('#say').onclick = () => speak(q.speakText);
    if ($('#sayP')) $('#sayP').onclick = () => speak(q.speakPassage);
  }
  if (q.type === 'order') {
    const placed = [];
    const zone = $('#zone'), check = $('#check');
    const draw = () => {
      zone.innerHTML = placed.map((k, p) => `<button class="tile" data-p="${p}">${esc(q.tiles[k])}</button>`).join('');
      app.querySelectorAll('#bank .tile').forEach(t => t.classList.toggle('used', placed.includes(+t.dataset.k)));
      zone.querySelectorAll('.tile').forEach(t => t.onclick = () => { if (G.answered) return; placed.splice(+t.dataset.p, 1); draw(); });
      check.disabled = placed.length !== q.tiles.length;
    };
    app.querySelectorAll('#bank .tile').forEach(t => t.onclick = () => { if (G.answered || placed.includes(+t.dataset.k)) return; placed.push(+t.dataset.k); draw(); });
    $('#clear').onclick = () => { if (G.answered) return; placed.length = 0; draw(); };
    check.onclick = () => { if (!G.answered) answerOrder(placed.map(k => q.tiles[k]).join(' ')); };
  }
  if (q.type === 'spot') app.querySelectorAll('.seg').forEach(b => b.onclick = () => answerSpot(+b.dataset.k));
  if (q.type === 'gap') {
    const inp = $('#typed');
    $('#check').onclick = () => { if (!G.answered) answerGap(inp.value); };
    inp.onkeydown = e => { if (e.key === 'Enter' && !G.answered) { e.preventDefault(); answerGap(inp.value); } };
    inp.focus();
  }
  if (q.type === 'type') {
    if ($('#say')) { $('#say').onclick = () => speak(q.answer); $('#saySlow').onclick = () => speak(q.answer, true); }
    const inp = $('#typed');
    $('#check').onclick = () => { if (!G.answered) answerType(inp.value); };
    inp.onkeydown = e => { if (e.key === 'Enter' && !G.answered) { e.preventDefault(); answerType(inp.value); } };
    if (hasTTS) setTimeout(() => speak(q.answer), 250);
    inp.focus();
  }
  window.scrollTo(0, 0);
}

function answerMC(k) {
  if (G.answered) return;
  const q = G.q, chosen = q.choices[k], ok = chosen === q.answer;
  app.querySelectorAll('.choice').forEach((b, j) => {
    b.disabled = true;
    if (q.choices[j] === q.answer) b.classList.add('ok');
    else if (j === k) b.classList.add('no');
  });
  if (hasTTS && (q.speakAfter || q.speakAnswer)) speak(q.answer);
  let extra = q.explain || '';
  if (q.full) extra = '<i>' + esc(q.full) + '</i><br>' + extra;
  finish(ok, chosen, extra);
}
function answerOrder(given) {
  const q = G.q, ok = given === q.answer;
  finish(ok, given, '<i>' + esc(q.answer) + '</i>');
  if (hasTTS) speak(q.answer);
}
function answerSpot(k) {
  if (G.answered) return;
  const q = G.q, ok = k === q.wi;
  app.querySelectorAll('.seg').forEach((b, j) => { b.disabled = true; if (j === q.wi) b.classList.add('ok'); else if (j === k) b.classList.add('no'); });
  finish(ok, q.segs[k], `แก้ <s>${esc(q.segs[q.wi])}</s> เป็น <b>${esc(q.fix)}</b><br>${q.explain}`);
}
function answerGap(given) {
  const q = G.q, g = expand(given), ok = !!g && q.answers.some(a => expand(a) === g);
  $('#typed').readOnly = true;
  const others = q.answers.length > 1 ? '<br>คำตอบอื่นที่ถูก: ' + q.answers.slice(1).map(a => '<i>' + esc(a) + '</i>').join(', ') : '';
  finish(ok, given, '<i>' + esc(q.answer) + '</i>' + others);
  if (hasTTS) speak(q.answer);
}
function answerType(given) {
  const q = G.q, ok = norm(given) === norm(q.answer);
  $('#typed').readOnly = true;
  let detail = '<i>' + esc(q.answer) + '</i> — ' + esc(q.th);
  if (!ok && given.trim()) {
    const want = norm(q.answer).split(' '), got = norm(given).split(' ');
    detail += '<br>คุณพิมพ์: ' + got.map((w, j) => w === want[j] ? esc(w) : '<b style="color:var(--bad)">' + esc(w) + '</b>').join(' ');
  }
  finish(ok, given, detail);
}

function finish(ok, given, detail) {
  G.answered = true;
  const q = G.q, li = lvIndex(q.lv);
  if (G.kind === 'placement') {
    G.tally[li][1]++; if (ok) G.tally[li][0]++;
    G.cur = ok ? Math.min(5, G.cur + 1) : Math.max(0, G.cur - 1);
  }
  if (ok) {
    G.right++; G.combo++;
    const gain = Math.round((10 + 4 * li) * Math.min(2, 1 + Math.max(0, G.combo - 1) * 0.1));
    G.xp += gain; S.xp += gain;
    S.mastered[q.id] = true;
    if (G.kind === 'review') delete S.mistakes[q.id];
  } else {
    G.combo = 0;
    if (G.hearts != null) G.hearts--;
    S.mistakes[q.id] = 1;
    G.misses.push({ q, given });
  }
  save();
  const rq = ruleOf(q);
  const last = G.kind === 'placement' ? G.i + 1 >= G.total : (G.i + 1 >= G.queue.length || G.hearts === 0);
  $('#fb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'no'}" role="status">
      <h3>${ok ? pickOne(['ถูกต้อง!', 'เยี่ยม!', 'แม่นมาก!', 'Excellent!']) : 'ยังไม่ถูก'}</h3>
      ${!ok && (q.type === 'mc' || q.type === 'gap') ? `<p>คำตอบที่ถูก: <b>${esc(q.answer)}</b></p>` : ''}
      ${detail ? `<p>${detail}</p>` : ''}
      ${rq ? ruleHTML(rq, !ok) : ''}
      <button class="btn lv block" id="next">${last ? 'ดูผล' : 'ข้อต่อไป'}</button>
    </div>`;
  const nb = $('#next');
  nb.onclick = () => { G.i++; next(); };
  nb.focus({ preventScroll: true });
  $('#fb').scrollIntoView({ behavior: 'smooth', block: !ok && rq ? 'start' : 'nearest' });
  const c = $('.combo'); if (c) c.textContent = G.combo >= 3 ? 'คอมโบ ×' + G.combo : '';
  const h = $('.hearts'); if (h) h.textContent = '♥'.repeat(G.hearts) + '♡'.repeat(3 - G.hearts);
}
const pickOne = a => a[Math.floor(Math.random() * a.length)];

document.addEventListener('keydown', e => {
  if (!G || !G.q || e.target.tagName === 'INPUT') return;
  if (G.answered && e.target.tagName !== 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); G.i++; next(); return; }
  if (!G.answered && G.q.type === 'mc' && /^[1-4]$/.test(e.key)) answerMC(+e.key - 1);
});

function missList() {
  if (!G.misses.length) return '';
  return `<section class="list"><p class="eyebrow">ข้อที่ตอบผิด · เก็บไว้ในรายการทบทวนแล้ว</p>
    ${G.misses.map(m => `<div class="miss"><span class="muted">${esc(m.q.lv)} · ${esc(m.q.orig || m.q.prompt || (m.q.isWord ? 'ฟังคำศัพท์' : 'ฟังประโยค'))}</span>
      <span>คำตอบที่ถูก: <b>${esc(m.q.answer)}</b></span></div>`).join('')}</section>`;
}

function result() {
  const total = G.queue.length, done = Math.max(1, G.i);
  const pct = total ? Math.round(G.right / done * 100) : 0;
  let headline = G.hearts === 0 ? 'หัวใจหมดแล้ว' : pct >= 90 ? 'ยอดเยี่ยม' : pct >= 70 ? 'ทำได้ดี' : 'ฝึกต่ออีกนิด';
  let extra = '';
  if (G.kind === 'exam') {
    const pass = G.right >= 12;
    S.best[G.lv] = Math.max(S.best[G.lv] || 0, G.right);
    if (pass) S.passed[G.lv] = true;
    save();
    const nextLv = LEVELS[lvIndex(G.lv) + 1];
    headline = pass ? `ผ่านระดับ ${G.lv}` : `ยังไม่ผ่าน ${G.lv}`;
    extra = `<div class="cando"><p>${pass
      ? (nextLv ? `คุณใช้ภาษาอังกฤษได้ในระดับ ${G.lv} แล้ว ลองฝึกระดับ ${nextLv} ต่อได้เลย` : 'คุณผ่านระดับสูงสุด C2 Proficiency แล้ว')
      : `ต้องได้ 12 จาก 15 ข้อ ลองฝึกโหมดที่ผิดบ่อยแล้วกลับมาสอบใหม่`}</p></div>`;
  }
  if (G.mode === 'story') {
    S.stories = S.stories || {};
    const sid = G.lv + '-' + G.story;
    S.stories[sid] = Object.assign({ read: true }, S.stories[sid]);
    S.stories[sid].best = Math.max(S.stories[sid].best || 0, G.right); save();
  }
  app.innerHTML = `
    <header style="display:flex;flex-direction:column;gap:8px">
      <p class="eyebrow">${G.kind === 'review' ? 'ทบทวน' : G.lv + ' · ' + MODES[G.mode].th}</p>
      <h1>${headline}</h1>
    </header>
    <div class="row" style="align-items:flex-end">
      <div><div class="score num">${G.right}<span style="font-size:1.6rem;color:var(--muted)">/${G.kind === 'exam' ? total : done}</span></div><span class="muted">ตอบถูก ${pct}%</span></div>
      <div style="text-align:right"><div class="num" style="font-size:1.6rem;font-weight:500">+${G.xp} XP</div><span class="muted">รวม ${S.xp} XP</span></div>
    </div>
    ${extra}
    ${missList()}
    <div class="row">
      <button class="btn ghost" id="toHome">หน้าหลัก</button>
      ${G.kind === 'review'
        ? (Object.keys(S.mistakes).length ? '<button class="btn lv" id="again">ทบทวนต่อ</button>' : '')
        : `<button class="btn lv" id="again">${G.kind === 'exam' ? 'สอบอีกครั้ง' : 'เล่นอีกรอบ'}</button>`}
    </div>`;
  $('#toHome').onclick = home;
  if ($('#again')) $('#again').onclick = () => G.kind === 'review' ? startReview() : G.story != null ? startStoryQuiz(G.lv, G.story, G.mode) : startRound(G.lv, G.mode);
  if (G.story != null) { const b = document.createElement('button'); b.className = 'btn ghost'; b.id = 'backStory'; b.textContent = 'กลับไปที่เรื่อง'; const lv = G.lv, i = G.story; b.onclick = () => openStory(lv, i, 'tr'); $('#toHome').after(b); }
  window.scrollTo(0, 0);
}

function placementResult() {
  // Highest level answered at least twice with two thirds or more correct.
  let est = 0;
  G.tally.forEach(([r, n], k) => { if (n >= 2 && r / n >= 2 / 3) est = Math.max(est, k); });
  const lv = LEVELS[est];
  S.placement = lv; save(); setLv(lv);
  const rows = G.tally.map(([r, n], k) => n ? `<div class="miss" style="flex-direction:row;justify-content:space-between"><span><b style="color:var(--${LEVELS[k]})">${LEVELS[k]}</b> ${INFO[LEVELS[k]].name}</span><span class="num">${r}/${n}</span></div>` : '').join('');
  app.innerHTML = `
    <header style="display:flex;flex-direction:column;gap:8px">
      <p class="eyebrow">ผลการวัดระดับ</p>
      <h1>ระดับโดยประมาณของคุณ</h1>
    </header>
    <div class="lvhead"><span class="bigcode" style="font-size:5rem">${lv}</span>
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0"><h2>${INFO[lv].name}</h2><span class="muted">${INFO[lv].th}</span></div></div>
    <div class="cando"><p class="eyebrow">คุณน่าจะทำสิ่งนี้ได้แล้ว</p><p>${INFO[lv].can}</p></div>
    <section class="list"><p class="eyebrow">ตอบถูกในแต่ละระดับ</p>${rows}</section>
    <p class="foot">ผลนี้เป็นการประมาณจากคำศัพท์และไวยากรณ์ 15 ข้อ ใช้เป็นจุดเริ่มฝึก ไม่ใช่ผลสอบอย่างเป็นทางการ</p>
    <div class="row"><button class="btn ghost" id="toHome">หน้าหลัก</button><button class="btn lv" id="go">เริ่มฝึก ${lv}</button></div>`;
  $('#toHome').onclick = home;
  $('#go').onclick = () => level(lv);
  window.scrollTo(0, 0);
}

home();
</script>
</body>
</html>
