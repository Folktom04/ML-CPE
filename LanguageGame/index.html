<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEFR Ladder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow app column; home is a ladder of six CEFR rungs, C2 at the top. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #16213a;
  --muted: #5b6680;
  --line: #d5dbe7;
  --chip: #e3e8f2;
  --good: #1f8a4c;
  --good-bg: #e2f4ea;
  --bad: #c92a3a;
  --bad-bg: #fbe5e7;
  --A1: #2b9348; --A2: #6a9f1a; --B1: #0a72b5; --B2: #1d3f94; --C1: #8a45cc; --C2: #6a1fa8;
  --display: "Bricolage Grotesque", "IBM Plex Sans Thai", system-ui, sans-serif;
  --body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --lv: var(--B1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1424; --surface: #182036; --ink: #e8ecf5; --muted: #9aa6c0; --line: #2b3550; --chip: #222b44;
    --good: #4fd187; --good-bg: #173a2a; --bad: #ff7083; --bad-bg: #42202a;
    --A1: #4cc46f; --A2: #9ccc3a; --B1: #40a6ec; --B2: #7b9cff; --C1: #b98af0; --C2: #d08cff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1424; --surface: #182036; --ink: #e8ecf5; --muted: #9aa6c0; --line: #2b3550; --chip: #222b44;
  --good: #4fd187; --good-bg: #173a2a; --bad: #ff7083; --bad-bg: #42202a;
  --A1: #4cc46f; --A2: #9ccc3a; --B1: #40a6ec; --B2: #7b9cff; --C1: #b98af0; --C2: #d08cff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 20px;
}
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.35rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--lv); outline-offset: 2px; }
.muted { color: var(--muted); }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.stats { display: flex; gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; display: flex; flex-direction: column; align-items: flex-end; }
.stat b { font-family: var(--mono); font-size: 1.05rem; }
.stat span { font-size: .7rem; color: var(--muted); }

.btn {
  border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600;
  background: var(--ink); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .08s ease;
}
.btn:active { transform: scale(.98); }
.btn.lv { background: var(--lv); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.block { width: 100%; }

.banner {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
  display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap;
}
.banner > div { min-width: 0; flex: 1 1 240px; display: flex; flex-direction: column; gap: 4px; }

/* the ladder */
.ladder { display: flex; flex-direction: column; gap: 10px; position: relative; }
.rung {
  --lv: var(--A1);
  display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
  text-align: left; width: 100%;
}
.rung:hover { border-color: var(--lv); }
.rung .code {
  font-family: var(--display); font-weight: 800; font-size: 1.7rem; color: var(--lv);
  border-right: 2px solid var(--lv); line-height: 1; padding-block: 6px;
}
.rung .info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.rung .info b { font-weight: 600; }
.rung .info small { color: var(--muted); font-size: .82rem; line-height: 1.4; }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lv); border-radius: 3px; transition: width .4s ease; }
.seal {
  font-family: var(--mono); font-size: .7rem; padding: 3px 8px; border-radius: 999px;
  border: 1.5px solid var(--lv); color: var(--lv); white-space: nowrap;
}
.seal.off { border-style: dashed; color: var(--muted); border-color: var(--line); }
.here { background: var(--lv); color: #fff; border-color: var(--lv); }

/* level sheet */
.lvhead { display: flex; gap: 16px; align-items: center; }
.bigcode { font-family: var(--display); font-weight: 800; font-size: 3.4rem; color: var(--lv); line-height: 1; letter-spacing: -0.03em; }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mode {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 96px;
}
.mode:hover { border-color: var(--lv); }
.mode b { font-weight: 600; }
.mode small { color: var(--muted); font-size: .8rem; line-height: 1.4; }
.mode .tag { font-family: var(--mono); font-size: .72rem; color: var(--lv); }
.mode.exam { grid-column: 1 / -1; background: var(--lv); color: #fff; border-color: var(--lv); }
.mode.exam small, .mode.exam .tag { color: rgba(255,255,255,.85); }

/* play */
.playbar { display: flex; align-items: center; gap: 12px; }
.x { border: 0; background: none; font-size: 1.5rem; line-height: 1; padding: 4px 6px; color: var(--muted); }
.progress { flex: 1; height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--lv); transition: width .3s ease; }
.hearts { font-family: var(--mono); color: var(--bad); white-space: nowrap; }
.combo { font-family: var(--mono); font-size: .8rem; color: var(--lv); min-height: 1.2em; text-align: right; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.kind { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.pill { font-family: var(--mono); font-size: .72rem; padding: 3px 9px; border-radius: 999px; background: var(--lv); color: #fff; }
.prompt { font-size: 1.3rem; font-weight: 500; line-height: 1.45; overflow-wrap: anywhere; }
.prompt.word { font-family: var(--display); font-size: 2.1rem; font-weight: 700; letter-spacing: -0.01em; }
.prompt .gap { display: inline-block; min-width: 3.5em; border-bottom: 2px solid var(--lv); }
.sub { color: var(--muted); font-size: .92rem; }
.passage { background: var(--chip); border-radius: 12px; padding: 14px; font-size: .97rem; line-height: 1.65; max-height: 42vh; overflow-y: auto; }

.choices { display: flex; flex-direction: column; gap: 10px; }
.choice {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px;
  text-align: left; display: flex; gap: 12px; align-items: baseline; overflow-wrap: anywhere;
}
.choice:hover:not(:disabled) { border-color: var(--lv); }
.choice kbd { font-family: var(--mono); font-size: .72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.choice.ok { border-color: var(--good); background: var(--good-bg); }
.choice.no { border-color: var(--bad); background: var(--bad-bg); }
.choice:disabled { cursor: default; }

.speak { border: 1px solid var(--line); background: var(--chip); border-radius: 10px; padding: 8px 12px; font-size: .9rem; }
.speakrow { display: flex; gap: 8px; flex-wrap: wrap; }

.answer-zone { min-height: 64px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-size: 1rem; }
.tile:hover { border-color: var(--lv); }
.tile.used { visibility: hidden; }

.textin { width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }

.feedback { border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.feedback.ok { background: var(--good-bg); }
.feedback.no { background: var(--bad-bg); }
.feedback h3 { font-size: 1.1rem; }
.feedback.ok h3 { color: var(--good); }
.feedback.no h3 { color: var(--bad); }
.feedback p { font-size: .93rem; }

/* result */
.score { font-family: var(--display); font-weight: 800; font-size: 4rem; line-height: 1; color: var(--lv); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.miss { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: .9rem; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
.miss b { color: var(--good); font-weight: 600; }
.cando { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.confirm { background: var(--bad-bg); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.settings { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.settings label { display: flex; justify-content: space-between; gap: 12px; align-items: center; font-size: .9rem; }
.foot { font-size: .8rem; color: var(--muted); }
@media (max-width: 420px) {
  .modes { grid-template-columns: 1fr; }
  .rung { grid-template-columns: 52px 1fr; }
  .rung .seal { grid-column: 2; justify-self: start; }
  h1 { font-size: 1.7rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.97); opacity: .6; } to { transform: none; opacity: 1; } }
.card { animation: pop .18s ease-out; }
</style>
</head>

const KEY = 'cefr-ladder-v1';
const fresh = () => ({ xp: 0, streak: 0, lastDay: '', mastered: {}, mistakes: {}, passed: {}, best: {}, placement: '', rate: 0.9 });
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function touchStreak() {
  const t = today();
  if (S.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yk = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate();
  S.streak = S.lastDay === yk ? S.streak + 1 : 1;
  S.lastDay = t;
}

/* ------------------------------------------------------------------ */
/* Helpers                                                             */
/* ------------------------------------------------------------------ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const lvIndex = l => LEVELS.indexOf(l);
const norm = s => s.toLowerCase().replace(/[‘’]/g, "'").replace(/[.,!?;:"“”]/g, '').replace(/\s+/g, ' ').trim();
function setLv(l) { document.documentElement.style.setProperty('--lv', 'var(--' + l + ')'); }

let voice = null;
const hasTTS = 'speechSynthesis' in window;
function loadVoice() {
  if (!hasTTS) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (hasTTS) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function speak(text, slow) {
  if (!hasTTS) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : 'en-GB';
    if (voice) u.voice = voice;
    u.rate = slow ? 0.6 : S.rate;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ------------------------------------------------------------------ */
/* Question builders. Every question has a stable id so mistakes can   */
/* be rebuilt later in Review.  id = level|mode|index[|sub]            */
/* ------------------------------------------------------------------ */
function build(id) {
  const [lv, mode, a, b] = id.split('|');
  const D = DATA[lv], li = lvIndex(lv), i = +a;
  if (mode === 'vocab') {
    const [w, th, def] = D.vocab[i];
    const others = D.vocab.filter((_, k) => k !== i);
    const dir = li <= 2 ? (Math.random() < .6 ? 'en-th' : 'th-en') : (Math.random() < .6 ? 'word-def' : 'def-word');
    const q = { id, lv, mode, type: 'mc', speakText: w };
    if (dir === 'en-th') Object.assign(q, { prompt: w, big: true, sub: 'คำนี้แปลว่าอะไร', answer: th, choices: shuffle([th, ...pick(others, 3).map(x => x[1])]) });
    if (dir === 'th-en') Object.assign(q, { prompt: th, big: true, sub: 'ภาษาอังกฤษคือคำไหน', answer: w, choices: shuffle([w, ...pick(others, 3).map(x => x[0])]), speakAfter: true });
    if (dir === 'word-def') Object.assign(q, { prompt: w, big: true, sub: 'Choose the best definition.', answer: def, choices: shuffle([def, ...pick(others, 3).map(x => x[2])]) });
    if (dir === 'def-word') Object.assign(q, { prompt: '“' + def + '”', sub: 'Which word matches this definition?', answer: w, choices: shuffle([w, ...pick(others, 3).map(x => x[0])]), speakAfter: true });
    q.explain = '<b>' + esc(w) + '</b> = ' + esc(th) + ' — <i>' + esc(def) + '</i>';
    return q;
  }
  if (mode === 'grammar') {
    const [s, ans, wrong, note] = D.grammar[i];
    return { id, lv, mode, type: 'mc', prompt: s, gap: true, sub: 'เลือกคำที่เติมแล้วถูกต้อง', answer: ans, choices: shuffle([ans, ...wrong]),
      explain: esc(note), full: s.replace('___', ans) };
  }
  if (mode === 'order') {
    const [en, th] = D.order[i];
    const words = en.split(' ');
    let tiles = shuffle(words);
    for (let t = 0; t < 5 && tiles.join(' ') === en; t++) tiles = shuffle(words);
    return { id, lv, mode, type: 'order', prompt: th, sub: 'เรียงคำให้ได้ความหมายนี้', answer: en, tiles };
  }
  if (mode === 'listen') {
    // a = 'w' + vocab index or 's' + sentence index
    const isWord = a[0] === 'w', k = +a.slice(1);
    const text = isWord ? D.vocab[k][0] : D.order[k][0];
    const th = isWord ? D.vocab[k][1] : D.order[k][1];
    return { id, lv, mode, type: 'type', answer: text, th, isWord };
  }
  if (mode === 'reading') {
    const P = D.reading[i], [qq, ans, wrong] = P.qs[+b];
    return { id, lv, mode, type: 'mc', passage: P.p, prompt: qq, answer: ans, choices: shuffle([ans, ...wrong]), speakPassage: P.p };
  }
}

function ids(lv, mode) {
  const D = DATA[lv];
  if (mode === 'vocab') return D.vocab.map((_, i) => `${lv}|vocab|${i}`);
  if (mode === 'grammar') return D.grammar.map((_, i) => `${lv}|grammar|${i}`);
  if (mode === 'order') return D.order.map((_, i) => `${lv}|order|${i}`);
  if (mode === 'listen') return [...D.order.map((_, i) => `${lv}|listen|s${i}`), ...D.vocab.map((_, i) => `${lv}|listen|w${i}`)];
  if (mode === 'reading') return D.reading.flatMap((P, i) => P.qs.map((_, j) => `${lv}|reading|${i}|${j}`));
}
function totalItems(lv) { return ['vocab','grammar','order','reading'].reduce((n, m) => n + ids(lv, m).length, 0); }
function mastery(lv) {
  const all = ['vocab','grammar','order','reading'].flatMap(m => ids(lv, m));
  return all.filter(id => S.mastered[id]).length / all.length;
}

function roundIds(lv, mode) {
  if (mode === 'reading') return ids(lv, 'reading');
  if (mode === 'listen') {
    const s = pick(ids(lv, 'listen').filter(x => x.includes('|s')), 4);
    const w = pick(ids(lv, 'listen').filter(x => x.includes('|w')), 4);
    return shuffle([...s, ...w]);
  }
  if (mode === 'exam') {
    const P = DATA[lv].reading[Math.floor(Math.random() * DATA[lv].reading.length)];
    const pi = DATA[lv].reading.indexOf(P);
    return [
      ...pick(ids(lv, 'vocab'), 5), ...pick(ids(lv, 'grammar'), 5), ...pick(ids(lv, 'order'), 3),
      `${lv}|reading|${pi}|0`, `${lv}|reading|${pi}|1`
    ];
  }
  return pick(ids(lv, mode), 10);
}

/* ---------------- game loop ---------------- */
function startRound(lv, mode) {
  touchStreak(); save();
  G = { kind: mode === 'exam' ? 'exam' : 'practice', lv, mode, queue: roundIds(lv, mode), i: 0, right: 0, hearts: mode === 'exam' ? null : 3, combo: 0, xp: 0, misses: [] };
  next();
}
function startReview() {
  touchStreak(); save();
  const q = pick(Object.keys(S.mistakes), 10);
  G = { kind: 'review', lv: null, mode: 'review', queue: q, i: 0, right: 0, hearts: null, combo: 0, xp: 0, misses: [] };
  next();
}
function startPlacement() {
  touchStreak(); save();
  G = { kind: 'placement', lv: 'B1', cur: 2, mode: 'placement', queue: [], i: 0, right: 0, hearts: null, combo: 0, xp: 0, misses: [], total: 15, tally: LEVELS.map(() => [0, 0]), used: {} };
  next();
}
function placementId() {
  const lv = LEVELS[G.cur];
  const pool = [...ids(lv, 'vocab'), ...ids(lv, 'grammar')].filter(x => !G.used[x]);
  const id = pool[Math.floor(Math.random() * pool.length)];
  G.used[id] = 1;
  return id;
}

function next() {
  if (G.kind === 'placement') {
    if (G.i >= G.total) return placementResult();
    G.queue[G.i] = placementId();
  } else if (G.i >= G.queue.length || G.hearts === 0) return result();
  const q = build(G.queue[G.i]);
  G.q = q; G.answered = false;
  setLv(q.lv);
  render(q);
}

function header() {
  const total = G.kind === 'placement' ? G.total : G.queue.length;
  const pct = Math.round(G.i / total * 100);
  const right = G.hearts == null ? `<span class="num muted">${G.i + 1}/${total}</span>` : `<span class="hearts" aria-label="หัวใจเหลือ ${G.hearts}">${'♥'.repeat(G.hearts)}${'♡'.repeat(3 - G.hearts)}</span>`;
  return `<div class="playbar"><button class="x" id="quit" aria-label="ออก">×</button>
    <div class="progress"><i style="width:${pct}%"></i></div>${right}</div>
    <div class="combo">${G.combo >= 3 ? 'คอมโบ ×' + G.combo : ''}</div>`;
}

function render(q) {
  const label = G.kind === 'placement' ? 'วัดระดับ' : G.kind === 'exam' ? 'สอบผ่านระดับ' : G.kind === 'review' ? 'ทบทวน' : MODES[q.mode].th;
  let body = '';
  if (q.type === 'mc') {
    const prompt = q.gap ? esc(q.prompt).replace('___', '<span class="gap"></span>') : esc(q.prompt);
    body = `
      ${q.passage ? `<div class="passage" tabindex="0">${esc(q.passage)}</div>` : ''}
      <div style="display:flex;flex-direction:column;gap:6px">
        <p class="prompt ${q.big ? 'word' : ''}">${prompt}</p>
        ${q.sub ? `<p class="sub">${q.sub}</p>` : ''}
      </div>
      ${hasTTS && q.speakText && !q.speakAfter ? `<div class="speakrow"><button class="speak" id="say">🔊 ฟังเสียง</button></div>` : ''}
      ${hasTTS && q.speakPassage ? `<div class="speakrow"><button class="speak" id="sayP">🔊 ฟังบทความ</button></div>` : ''}
      <div class="choices">${q.choices.map((c, k) => `<button class="choice" data-k="${k}" id="c${k}"><kbd>${k + 1}</kbd><span>${esc(c)}</span></button>`).join('')}</div>`;
  } else if (q.type === 'order') {
    body = `
      <div style="display:flex;flex-direction:column;gap:6px"><p class="prompt">${esc(q.prompt)}</p><p class="sub">${q.sub}</p></div>
      <div class="answer-zone" id="zone" aria-label="ประโยคของคุณ"></div>
      <div class="bank" id="bank">${q.tiles.map((t, k) => `<button class="tile" data-k="${k}" id="t${k}">${esc(t)}</button>`).join('')}</div>
      <div class="row"><button class="btn ghost" id="clear">ล้าง</button><button class="btn lv" id="check" disabled>ตรวจคำตอบ</button></div>`;
  } else if (q.type === 'type') {
    const tts = hasTTS;
    body = `
      <div style="display:flex;flex-direction:column;gap:6px">
        <p class="prompt">${tts ? (q.isWord ? 'ฟังคำศัพท์แล้วพิมพ์ให้ถูกต้อง' : 'ฟังประโยคแล้วพิมพ์ให้ครบทุกคำ') : 'สะกดเป็นภาษาอังกฤษ: ' + esc(q.th)}</p>
        <p class="sub">${tts ? 'ไม่ต้องสนใจตัวพิมพ์ใหญ่และเครื่องหมายวรรคตอน' : 'ตัวอักษรแรกคือ “' + esc(q.answer[0]) + '” · ' + q.answer.length + ' ตัวอักษร'}</p>
      </div>
      ${tts ? `<div class="speakrow"><button class="speak" id="say">🔊 เล่นเสียง</button><button class="speak" id="saySlow">🐢 ช้าลง</button></div>` : ''}
      <input class="textin" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์ที่นี่" aria-label="คำตอบ">
      <button class="btn lv block" id="check">ตรวจคำตอบ</button>`;
  }
  app.innerHTML = `${header()}
    <article class="card">
      <div class="kind"><span class="pill">${q.lv} · ${MODES[q.mode].tag}</span><span class="muted" style="font-size:.85rem">${label}</span></div>
      ${body}
      <div id="fb"></div>
    </article>`;
  $('#quit').onclick = () => (G.kind === 'practice' || G.kind === 'exam') ? level(G.lv) : home();

  if (q.type === 'mc') {
    app.querySelectorAll('.choice').forEach(b => b.onclick = () => answerMC(+b.dataset.k));
    if ($('#say')) $('#say').onclick = () => speak(q.speakText);
    if ($('#sayP')) $('#sayP').onclick = () => speak(q.speakPassage);
  }
  if (q.type === 'order') {
    const placed = [];
    const zone = $('#zone'), check = $('#check');
    const draw = () => {
      zone.innerHTML = placed.map((k, p) => `<button class="tile" data-p="${p}">${esc(q.tiles[k])}</button>`).join('');
      app.querySelectorAll('#bank .tile').forEach(t => t.classList.toggle('used', placed.includes(+t.dataset.k)));
      zone.querySelectorAll('.tile').forEach(t => t.onclick = () => { if (G.answered) return; placed.splice(+t.dataset.p, 1); draw(); });
      check.disabled = placed.length !== q.tiles.length;
    };
    app.querySelectorAll('#bank .tile').forEach(t => t.onclick = () => { if (G.answered || placed.includes(+t.dataset.k)) return; placed.push(+t.dataset.k); draw(); });
    $('#clear').onclick = () => { if (G.answered) return; placed.length = 0; draw(); };
    check.onclick = () => { if (!G.answered) answerOrder(placed.map(k => q.tiles[k]).join(' ')); };
  }
  if (q.type === 'type') {
    if ($('#say')) { $('#say').onclick = () => speak(q.answer); $('#saySlow').onclick = () => speak(q.answer, true); }
    const inp = $('#typed');
    $('#check').onclick = () => { if (!G.answered) answerType(inp.value); };
    inp.onkeydown = e => { if (e.key === 'Enter' && !G.answered) { e.preventDefault(); answerType(inp.value); } };
    if (hasTTS) setTimeout(() => speak(q.answer), 250);
    inp.focus();
  }
  window.scrollTo(0, 0);
}

function answerMC(k) {
  if (G.answered) return;
  const q = G.q, chosen = q.choices[k], ok = chosen === q.answer;
  app.querySelectorAll('.choice').forEach((b, j) => {
    b.disabled = true;
    if (q.choices[j] === q.answer) b.classList.add('ok');
    else if (j === k) b.classList.add('no');
  });
  if (hasTTS && q.speakAfter) speak(q.answer);
  let extra = q.explain || '';
  if (q.full) extra = '<i>' + esc(q.full) + '</i><br>' + extra;
  finish(ok, chosen, extra);
}
function answerOrder(given) {
  const q = G.q, ok = given === q.answer;
  finish(ok, given, '<i>' + esc(q.answer) + '</i>');
  if (hasTTS) speak(q.answer);
}
function answerType(given) {
  const q = G.q, ok = norm(given) === norm(q.answer);
  $('#typed').readOnly = true;
  let detail = '<i>' + esc(q.answer) + '</i> — ' + esc(q.th);
  if (!ok && given.trim()) {
    const want = norm(q.answer).split(' '), got = norm(given).split(' ');
    detail += '<br>คุณพิมพ์: ' + got.map((w, j) => w === want[j] ? esc(w) : '<b style="color:var(--bad)">' + esc(w) + '</b>').join(' ');
  }
  finish(ok, given, detail);
}

function finish(ok, given, detail) {
  G.answered = true;
  const q = G.q, li = lvIndex(q.lv);
  if (G.kind === 'placement') {
    G.tally[li][1]++; if (ok) G.tally[li][0]++;
    G.cur = ok ? Math.min(5, G.cur + 1) : Math.max(0, G.cur - 1);
  }
  if (ok) {
    G.right++; G.combo++;
    const gain = Math.round((10 + 4 * li) * Math.min(2, 1 + Math.max(0, G.combo - 1) * 0.1));
    G.xp += gain; S.xp += gain;
    if (q.mode !== 'listen') S.mastered[q.id] = true;
    if (G.kind === 'review') delete S.mistakes[q.id];
  } else {
    G.combo = 0;
    if (G.hearts != null) G.hearts--;
    S.mistakes[q.id] = 1;
    G.misses.push({ q, given });
  }
  save();
  const last = G.kind === 'placement' ? G.i + 1 >= G.total : (G.i + 1 >= G.queue.length || G.hearts === 0);
  $('#fb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'no'}" role="status">
      <h3>${ok ? pickOne(['ถูกต้อง!', 'เยี่ยม!', 'แม่นมาก!', 'Excellent!']) : 'ยังไม่ถูก'}</h3>
      ${!ok && q.type === 'mc' ? `<p>คำตอบที่ถูก: <b>${esc(q.answer)}</b></p>` : ''}
      ${detail ? `<p>${detail}</p>` : ''}
      <button class="btn lv block" id="next">${last ? 'ดูผล' : 'ข้อต่อไป'}</button>
    </div>`;
  const nb = $('#next');
  nb.onclick = () => { G.i++; next(); };
  nb.focus({ preventScroll: true });
  $('#fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  const c = $('.combo'); if (c) c.textContent = G.combo >= 3 ? 'คอมโบ ×' + G.combo : '';
  const h = $('.hearts'); if (h) h.textContent = '♥'.repeat(G.hearts) + '♡'.repeat(3 - G.hearts);
}
const pickOne = a => a[Math.floor(Math.random() * a.length)];

document.addEventListener('keydown', e => {
  if (!G || !G.q || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
  if (G.answered && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); G.i++; next(); return; }
  if (!G.answered && G.q.type === 'mc' && /^[1-4]$/.test(e.key)) answerMC(+e.key - 1);
});

function missList() {
  if (!G.misses.length) return '';
  return `<section class="list"><p class="eyebrow">ข้อที่ตอบผิด · เก็บไว้ในรายการทบทวนแล้ว</p>
    ${G.misses.map(m => `<div class="miss"><span class="muted">${esc(m.q.lv)} · ${esc(m.q.prompt || (m.q.isWord ? 'ฟังคำศัพท์' : 'ฟังประโยค'))}</span>
      <span>คำตอบที่ถูก: <b>${esc(m.q.answer)}</b></span></div>`).join('')}</section>`;
}

function result() {
  const total = G.queue.length, done = Math.max(1, G.i);
  const pct = total ? Math.round(G.right / done * 100) : 0;
  let headline = G.hearts === 0 ? 'หัวใจหมดแล้ว' : pct >= 90 ? 'ยอดเยี่ยม' : pct >= 70 ? 'ทำได้ดี' : 'ฝึกต่ออีกนิด';
  let extra = '';
  if (G.kind === 'exam') {
    const pass = G.right >= 12;
    S.best[G.lv] = Math.max(S.best[G.lv] || 0, G.right);
    if (pass) S.passed[G.lv] = true;
    save();
    const nextLv = LEVELS[lvIndex(G.lv) + 1];
    headline = pass ? `ผ่านระดับ ${G.lv}` : `ยังไม่ผ่าน ${G.lv}`;
    extra = `<div class="cando"><p>${pass
      ? (nextLv ? `คุณใช้ภาษาอังกฤษได้ในระดับ ${G.lv} แล้ว ลองฝึกระดับ ${nextLv} ต่อได้เลย` : 'คุณผ่านระดับสูงสุด C2 Proficiency แล้ว')
      : `ต้องได้ 12 จาก 15 ข้อ ลองฝึกโหมดที่ผิดบ่อยแล้วกลับมาสอบใหม่`}</p></div>`;
  }
  app.innerHTML = `
    <header style="display:flex;flex-direction:column;gap:8px">
      <p class="eyebrow">${G.kind === 'review' ? 'ทบทวน' : G.lv + ' · ' + (G.kind === 'exam' ? 'สอบผ่านระดับ' : MODES[G.mode].th)}</p>
      <h1>${headline}</h1>
    </header>
    <div class="row" style="align-items:flex-end">
      <div><div class="score num">${G.right}<span style="font-size:1.6rem;color:var(--muted)">/${G.kind === 'exam' ? total : done}</span></div><span class="muted">ตอบถูก ${pct}%</span></div>
      <div style="text-align:right"><div class="num" style="font-size:1.6rem;font-weight:500">+${G.xp} XP</div><span class="muted">รวม ${S.xp} XP</span></div>
    </div>
    ${extra}
    ${missList()}
    <div class="row">
      <button class="btn ghost" id="toHome">หน้าหลัก</button>
      ${G.kind === 'review'
        ? (Object.keys(S.mistakes).length ? '<button class="btn lv" id="again">ทบทวนต่อ</button>' : '')
        : `<button class="btn lv" id="again">${G.kind === 'exam' ? 'สอบอีกครั้ง' : 'เล่นอีกรอบ'}</button>`}
    </div>`;
  $('#toHome').onclick = home;
  if ($('#again')) $('#again').onclick = () => G.kind === 'review' ? startReview() : startRound(G.lv, G.mode);
  window.scrollTo(0, 0);
}

function placementResult() {
  // Highest level answered at least twice with two thirds or more correct.
  let est = 0;
  G.tally.forEach(([r, n], k) => { if (n >= 2 && r / n >= 2 / 3) est = Math.max(est, k); });
  const lv = LEVELS[est];
  S.placement = lv; save(); setLv(lv);
  const rows = G.tally.map(([r, n], k) => n ? `<div class="miss" style="flex-direction:row;justify-content:space-between"><span><b style="color:var(--${LEVELS[k]})">${LEVELS[k]}</b> ${INFO[LEVELS[k]].name}</span><span class="num">${r}/${n}</span></div>` : '').join('');
  app.innerHTML = `
    <header style="display:flex;flex-direction:column;gap:8px">
      <p class="eyebrow">ผลการวัดระดับ</p>
      <h1>ระดับโดยประมาณของคุณ</h1>
    </header>
    <div class="lvhead"><span class="bigcode" style="font-size:5rem">${lv}</span>
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0"><h2>${INFO[lv].name}</h2><span class="muted">${INFO[lv].th}</span></div></div>
    <div class="cando"><p class="eyebrow">คุณน่าจะทำสิ่งนี้ได้แล้ว</p><p>${INFO[lv].can}</p></div>
    <section class="list"><p class="eyebrow">ตอบถูกในแต่ละระดับ</p>${rows}</section>
    <p class="foot">ผลนี้เป็นการประมาณจากคำศัพท์และไวยากรณ์ 15 ข้อ ใช้เป็นจุดเริ่มฝึก ไม่ใช่ผลสอบอย่างเป็นทางการ</p>
    <div class="row"><button class="btn ghost" id="toHome">หน้าหลัก</button><button class="btn lv" id="go">เริ่มฝึก ${lv}</button></div>`;
  $('#toHome').onclick = home;
  $('#go').onclick = () => level(lv);
  window.scrollTo(0, 0);
}

home();
</script>
</body>
</html>
