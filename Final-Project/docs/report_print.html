<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UV Guard Report</title>
<!--
  Print version of docs/report.md (day 29). Converts the Markdown in the browser with marked
  (pinned version) and is printed to PDF with Edge headless, see README / report notes:
  msedge --headless=new --allow-file-access-from-files --print-to-pdf=docs/report.pdf docs/report_print.html
  Needs internet access once per print to load marked from cdn.jsdelivr.net.
-->
<style>
  @page { size: A4; margin: 16mm 15mm 18mm 15mm; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: "Leelawadee UI", "Leelawadee", "Tahoma", sans-serif;
    font-size: 10.5pt; line-height: 1.55; color: #111; background: #fff; margin: 0;
  }
  main { max-width: 180mm; margin: 0 auto; }
  h1 { font-size: 17pt; line-height: 1.3; margin: 0 0 .4em; }
  h2 { font-size: 14pt; margin: 1.4em 0 .5em; border-bottom: 1px solid #999; break-after: avoid; }
  h3 { font-size: 12pt; margin: 1.1em 0 .4em; break-after: avoid; }
  h4 { font-size: 11pt; margin: 1em 0 .3em; break-after: avoid; }
  p, li { orphans: 2; widows: 2; }
  table { border-collapse: collapse; width: 100%; font-size: 8.5pt; margin: .6em 0; }
  tr { break-inside: avoid; }
  th, td { border: 1px solid #888; padding: 2px 4px; vertical-align: top; text-align: left; }
  th { background: #eee; }
  code { font-family: Consolas, "Courier New", monospace; font-size: 8pt; overflow-wrap: anywhere; }
  pre { background: #f4f4f4; padding: 6px 8px; white-space: pre-wrap; font-size: 8pt; break-inside: avoid; }
  pre code { font-size: 8pt; }
  img { display: block; max-width: 100%; max-height: 110mm; margin: .5em auto .2em; break-inside: avoid; }
  blockquote { border-left: 3px solid #aaa; margin: .6em 0; padding: .1em .8em; color: #333; }
  hr { border: 0; border-top: 1px solid #ccc; margin: 1.2em 0; }
  .error { color: #b00; font-weight: bold; }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<main id="content">กำลังแปลง report.md…</main>
<script>
  (function () {
    var out = document.getElementById('content');
    try {
      if (typeof marked === 'undefined') throw new Error('โหลด marked 12.0.2 จาก CDN ไม่สำเร็จ');
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'report.md', false); // file:// needs --allow-file-access-from-files
      xhr.overrideMimeType('text/markdown; charset=utf-8');
      xhr.send();
      if (!xhr.responseText) throw new Error('อ่าน report.md ไม่ได้');
      out.innerHTML = marked.parse(xhr.responseText, { gfm: true });
    } catch (e) {
      out.innerHTML = '<p class="error">' + String(e.message || e) + '</p>';
    }
  })();
</script>
</body>
</html>
